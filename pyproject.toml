[project]
name = "ip-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kagglehub<1.0.0",
    "kagglesdk>=0.1.23",
    "numpy>=2.4.6",
    "pillow>=11.0.0",
    "torch==2.11.0",
    "torchinfo>=1.8.0",
    "torchvision==0.26.0",
    "wandb>=0.27.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
